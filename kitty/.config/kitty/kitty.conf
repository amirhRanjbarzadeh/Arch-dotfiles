shell /usr/bin/zsh

font_size            12
window_padding_width 12
font_family          family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Regular

url_style curly

cursor_trail 3

scrollbar_hover_width         0.5
scrollbar_handle_opacity      0.1
scrollbar_radius              0.5
scrollbar_track_opacity       0
scrollbar_track_hover_opacity 0.1

sync_to_monitor      no
remember_window_size no

tab_bar_style       powerline
tab_powerline_style slanted

background_opacity 0.7

enabled_layouts splits,stack
map ctrl+shift+enter     launch --location=split  --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+l         toggle_layout stack

map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+k neighboring_window up
map alt+j neighboring_window down

include Themes/Catppuccin-Macchiato.conf