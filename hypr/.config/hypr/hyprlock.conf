# Fallback lock screen. The quickshell lock (quickshell/lock/) is the real one;
# hypridle only runs hyprlock when the shell isn't up to answer `qs ipc call lock lock`,
# so locking before sleep never depends on the bar being alive.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock

source = ~/.config/hypr/colors.conf
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# The wallpaper picked in the shell (the symlink hyprpaper also starts on).
background {
    monitor =
    path = ~/.local/state/wallpaper/current
    color = rgb($base)    # if the symlink is missing
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    rounding = 15

    outer_color = rgb($mauve) rgb($blue) 45deg
    check_color = rgb($blue)
    fail_color  = rgb($red)
    font_color  = rgb($text)
    inner_color = rgba(0, 0, 0, 0.0)

    font_family = $font
    fade_on_empty = false
    dots_spacing = 0.3
    placeholder_text = Password
    check_text = Authenticating…
    fail_text = $PAMFAIL

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgb($text)

    position = 0, 20%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font
    color = rgb($text)

    position = 0, 10%
    halign = center
    valign = center
}
