[Appearance]
# Generated from the wallpaper by quickshell/scripts/sync-app-theme.py; qt6ct
# watches this folder, so open apps recolor when you pick a wallpaper.
color_scheme_path=~/.config/qt6ct/wallpaper-colors.conf
custom_palette=true
icon_theme=breeze-dark
standard_dialogs=default
style=Breeze

[Interface]
activate_item_on_single_click=0
menus_have_icons=true
show_shortcuts_in_context_menus=true
